<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>天赋罗盘 · 职业天赋测试</title>
<style>
  :root{
    --bg:#070a12;
    --text:#e9edf7;
    --muted:#8992a8;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 18px 64px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- 背景光晕 ---------- */
  .orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(100px);}
  .o1{width:520px;height:520px;background:#3d5bff;top:-190px;left:-160px;opacity:.32;}
  .o2{width:480px;height:480px;background:#9b3dff;bottom:-180px;right:-140px;opacity:.24;}
  .o3{width:400px;height:400px;background:#00b894;top:42%;left:58%;opacity:.11;}

  #app{position:relative;z-index:1;width:100%;max-width:820px;}

  /* ---------- 屏幕切换 ---------- */
  .screen{display:none;}
  .screen.active{display:block;animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  /* ---------- 开始页 ---------- */
  .hero{text-align:center;padding:9vh 0 0;}
  .badge{
    display:inline-block;font-size:13px;letter-spacing:.04em;color:#a8b4d6;
    border:1px solid rgba(140,160,255,.32);
    background:rgba(110,130,255,.1);
    padding:7px 16px;border-radius:999px;margin-bottom:26px;
  }
  .hero h1{
    font-size:clamp(32px,7.4vw,54px);
    line-height:1.14;letter-spacing:-.025em;font-weight:800;
    margin-bottom:22px;
  }
  .grad{
    background:linear-gradient(110deg,#6d8bff 0%,#b06bff 48%,#3dd6a0 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .lead{
    color:var(--muted);font-size:16px;line-height:1.85;
    max-width:520px;margin:0 auto 40px;
  }
  .btn-primary{
    border:none;cursor:pointer;
    background:linear-gradient(110deg,#5b7bff,#a05cff);
    color:#fff;font-size:17px;font-weight:600;font-family:inherit;
    padding:16px 44px;border-radius:999px;
    box-shadow:0 12px 34px -10px rgba(120,110,255,.85);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 44px -10px rgba(130,110,255,.95);}
  .btn-primary:active{transform:translateY(0) scale(.985);}
  .meta{margin-top:34px;font-size:12.5px;color:#5f6880;letter-spacing:.02em;}

  /* ---------- 测试页 ---------- */
  .quiz-top{margin-bottom:22px;}
  .progress-info{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13.5px;color:var(--muted);margin-bottom:10px;
    font-variant-numeric:tabular-nums;
  }
  .link-btn{
    background:none;border:none;font-family:inherit;font-size:13.5px;
    color:#7c87a3;cursor:pointer;padding:4px 2px;transition:color .2s;
  }
  .link-btn:hover{color:#c3cbe0;}
  .progress-bar{
    height:5px;border-radius:99px;background:rgba(255,255,255,.075);overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#5b7bff,#a05cff,#3dd6a0);
    transition:width .4s cubic-bezier(.2,.8,.2,1);
  }
  .q-card{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
    border:1px solid var(--line);
    border-radius:22px;
    padding:34px 30px 22px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .q-card.anim{animation:qIn .38s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes qIn{from{opacity:0;transform:translateX(22px);}to{opacity:1;transform:none;}}

  .q-num{
    font-size:12.5px;font-weight:700;letter-spacing:.16em;
    color:#6d8bff;margin-bottom:14px;
  }
  .q-text{
    font-size:clamp(18px,3.4vw,21px);line-height:1.6;font-weight:600;
    margin-bottom:28px;letter-spacing:.005em;
  }
  .options{display:flex;flex-direction:column;gap:9px;}
  .option{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:14px 17px;
    background:rgba(255,255,255,.032);
    border:1px solid rgba(255,255,255,.075);
    border-radius:14px;
    color:#c4cddf;font-size:15px;font-family:inherit;
    cursor:pointer;text-align:left;
    transition:background .18s,border-color .18s,transform .18s,color .18s;
  }
  .option:hover{
    background:rgba(255,255,255,.075);
    border-color:rgba(120,140,255,.55);
    transform:translateX(4px);
    color:#fff;
  }
  .opt-dot{
    flex:0 0 24px;height:24px;line-height:22px;text-align:center;
    border-radius:50%;border:1px solid rgba(255,255,255,.22);
    font-size:12px;color:#96a1bb;transition:all .18s;
  }
  .option:hover .opt-dot{border-color:#7b8cff;color:#a9b6ff;}
  .option.selected{
    background:linear-gradient(110deg,rgba(91,123,255,.26),rgba(160,92,255,.22));
    border-color:#7b8cff;color:#fff;
  }
  .option.selected .opt-dot{background:#7b8cff;border-color:#7b8cff;color:#fff;font-weight:700;}
  .q-actions{margin-top:20px;text-align:center;}

  /* ---------- 结果页 ---------- */
  .result-head{text-align:center;margin-bottom:28px;}
  .eyebrow{
    font-size:12.5px;letter-spacing:.18em;color:#7c87a3;
    text-transform:uppercase;margin-bottom:12px;
  }
  .result-title{
    font-size:clamp(30px,6.6vw,46px);font-weight:800;line-height:1.2;
    letter-spacing:-.02em;margin-bottom:12px;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .result-tagline{color:var(--muted);font-size:15.5px;letter-spacing:.02em;}

  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .panel + .panel, .result-grid + .panel{margin-top:16px;}
  .panel-title{
    font-size:13px;font-weight:700;letter-spacing:.1em;
    color:#8a95b0;margin-bottom:18px;text-transform:uppercase;
  }
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .chart-panel{display:flex;align-items:center;justify-content:center;padding:14px;}
  #radar{display:block;width:100%;}

  .bar-row{margin-bottom:15px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;}
  .bar-name{font-weight:600;letter-spacing:.02em;}
  .bar-pct{color:var(--muted);font-variant-numeric:tabular-nums;}
  .bar-track{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
  .bar-track i{
    display:block;height:100%;border-radius:99px;background:var(--c);
    transform-origin:left;
    animation:grow .85s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  .desc-text{
    color:#b9c2d6;font-size:15px;line-height:1.95;
    margin-bottom:22px;letter-spacing:.01em;
  }
  .tag-group{margin-bottom:20px;}
  .tag-group:last-child{margin-bottom:0;}
  .tag-label{
    font-size:12.5px;color:#7c87a3;letter-spacing:.08em;margin-bottom:11px;
  }
  .tags{display:flex;flex-wrap:wrap;gap:9px;}
  .tag{
    font-size:13.5px;padding:7px 15px;border-radius:999px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    color:#c9d2e6;
  }
  .tag.career{
    background:rgba(110,130,255,.1);
    border-color:rgba(120,140,255,.28);
    color:#b7c2f0;
  }
  .env-text{
    margin-top:20px;padding-top:18px;
    border-top:1px dashed rgba(255,255,255,.1);
    font-size:14px;line-height:1.8;color:#9aa4bd;
  }
  .env-text strong{color:#c9d2e6;font-weight:600;}

  .sec-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);
    font-size:14.5px;
  }
  .sec-item:last-child{border-bottom:none;padding-bottom:0;}
  .sec-item:first-child{padding-top:0;}
  .sec-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .sec-name{font-weight:600;color:#dfe5f2;}
  .sec-score{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}

  .result-actions{text-align:center;margin-top:32px;}

  /* ---------- 移动端 ---------- */
  @media (max-width:640px){
    body{padding:20px 15px 50px;}
    .hero{padding-top:5vh;}
    .q-card{padding:26px 20px 18px;border-radius:18px;}
    .panel{padding:20px 18px;border-radius:17px;}
    .result-grid{grid-template-columns:1fr;}
    .chart-panel{padding:8px;}
    .option{font-size:14.5px;padding:13px 15px;}
  }
</style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <span class="orb o1"></span>
  <span class="orb o2"></span>
  <span class="orb o3"></span>
</div>

<main id="app">

  <!-- ============ 开始页 ============ -->
  <section class="screen active" id="screen-intro">
    <div class="hero">
      <div class="badge">30 道情境题 · 约 5 分钟</div>
      <h1>找到你的<br><span class="grad">天赋罗盘</span></h1>
      <p class="lead">
        每个人都有一套与生俱来的思维方式。<br>
        这份测试用 30 个真实情境，帮你找出最自然的那一种，<br>
        以及它最适合生长的土壤。
      </p>
      <button class="btn-primary" id="btn-start">开始测试 →</button>
      <div class="meta">基于霍兰德职业兴趣理论改编 · 结果仅供参考</div>
    </div>
  </section>

  <!-- ============ 测试页 ============ -->
  <section class="screen" id="screen-quiz">
    <div class="quiz-top">
      <div class="progress-info">
        <span id="q-index">1 / 30</span>
        <button class="link-btn" id="btn-quit">退出测试</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="q-card" id="q-card">
      <div class="q-num" id="q-num">Q1</div>
      <h2 class="q-text" id="q-text"></h2>
      <div class="options" id="options"></div>
      <div class="q-actions">
        <button class="link-btn" id="btn-prev">← 上一题</button>
      </div>
    </div>
  </section>

  <!-- ============ 结果页 ============ -->
  <section class="screen" id="screen-result">
    <div class="result-head">
      <div class="eyebrow">你的主导天赋</div>
      <h1 class="result-title" id="res-title"></h1>
      <p class="result-tagline" id="res-tagline"></p>
    </div>

    <div class="result-grid">
      <div class="panel chart-panel">
        <canvas id="radar"></canvas>
      </div>
      <div class="panel">
        <h3 class="panel-title">天赋分布</h3>
        <div id="bars"></div>
      </div>
    </div>

    <div class="panel" id="res-detail"></div>
    <div class="panel" id="res-secondary"></div>

    <div class="result-actions">
      <button class="btn-primary" id="btn-restart">重新测试</button>
    </div>
  </section>

</main>

<script>
(function(){
  'use strict';

  /* ============ 天赋类型定义 ============ */
  const TYPES = [
    {
      key:'AN', name:'逻辑分析型', short:'逻辑', color:'#5b8cff',
      tagline:'用理性拆解世界的思考者',
      desc:'你享受钻进复杂问题里，直到把底层规律摸清楚。面对一团乱麻的信息，别人看到的是噪音，你看到的是结构。你更相信证据和推理，而不是"大家都这么说"。',
      strengths:['深度思考','结构化拆解','客观理性','发现逻辑漏洞'],
      careers:['数据分析师','算法工程师','研究员','金融分析师','战略咨询顾问','医生','法律顾问'],
      env:'需要长时间独立思考、以问题为导向、允许试错与钻研的环境。'
    },
    {
      key:'CR', name:'创意表达型', short:'创意', color:'#b06bff',
      tagline:'把想法变成作品的造梦者',
      desc:'你的脑子里一直在冒出新的可能。你不满足于"本来就是这样"，总想试试"能不能不一样"，并且渴望把内心的感受，变成别人看得见、听得懂的东西。',
      strengths:['想象力','审美直觉','打破常规','从零创造'],
      careers:['设计师','内容创作者','广告策划','产品经理','编剧','摄影师','品牌创意'],
      env:'宽松自由、允许多样表达、鼓励尝试新方式的环境。'
    },
    {
      key:'CO', name:'沟通影响型', short:'沟通', color:'#ff8a4c',
      tagline:'推动他人一起行动的点燃者',
      desc:'你在人群里自带能量。你能快速捕捉到对方在意什么，再把想法包装成别人愿意接受的样子，让一群人愿意跟着你往前走。',
      strengths:['表达力','说服力','号召力','资源整合'],
      careers:['市场营销','销售总监','公关','律师','创业者','主持人','商务拓展'],
      env:'高频与人打交道、需要推动决策、以结果为导向的环境。'
    },
    {
      key:'EM', name:'协作共情型', short:'共情', color:'#3dd6a0',
      tagline:'读懂人心的连接者',
      desc:'你天生能"读懂"人。别人的情绪变化很难逃过你的眼睛，而你也发自内心地希望身边人变好——这让你成为团队里最被信任的那一个。',
      strengths:['倾听共情','关系建立','耐心陪伴','成就他人'],
      careers:['心理咨询师','教师','人力资源','护士','社会工作','培训师','用户研究'],
      env:'以人为中心、重视信任关系、能看见自己对他人的正面影响的环境。'
    },
    {
      key:'EX', name:'执行组织型', short:'执行', color:'#ffce4c',
      tagline:'让计划稳稳落地的推进者',
      desc:'你是那个把想法真正变成结果的人。你相信秩序的力量，喜欢把一团乱麻整理成清晰的步骤，然后一步一步稳稳走到终点。',
      strengths:['条理性','可靠守时','细节把控','流程优化'],
      careers:['项目经理','财务','运营','审计','行政管理','供应链管理','质量控制'],
      env:'规则清晰、目标明确、以交付质量和稳定性衡量价值的环境。'
    },
    {
      key:'PR', name:'动手实践型', short:'实践', color:'#ff6b8b',
      tagline:'相信手感胜过空谈的行动派',
      desc:'比起在纸上推演，你更相信手感和现场。你的双手是你最好的工具，把一个想法变成能摸得到的东西，会给你带来最真实的成就感。',
      strengths:['动手能力','空间感','现场应变','实操落地'],
      careers:['机械工程师','产品结构设计','厨师','外科医生','飞行员','手工艺人','运动教练'],
      env:'需要动手操作、能看到实物成果、节奏明快的环境。'
    }
  ];

  /* ============ 题库 ============ */
  const RAW_QUESTIONS = [
    {t:'AN', q:'我喜欢钻研复杂问题背后的原理，直到彻底弄懂'},
    {t:'AN', q:'面对一堆杂乱的信息，我能快速理出条理和逻辑'},
    {t:'AN', q:'我习惯用数据或证据来判断一件事的对错'},
    {t:'AN', q:'听到一个结论时，我会先想：它的推理站得住脚吗'},
    {t:'AN', q:'我喜欢解谜题、做推理题，或者研究事物运行的规律'},
    {t:'CR', q:'我经常冒出别人想不到的点子'},
    {t:'CR', q:'我喜欢用文字、图像、音乐或设计来表达自己'},
    {t:'CR', q:'一成不变的节奏会让我感到窒息'},
    {t:'CR', q:'我容易在平常的事物中发现美感和灵感'},
    {t:'CR', q:'我愿意尝试没人做过的方式，哪怕可能失败'},
    {t:'CO', q:'我很容易说服别人接受我的观点'},
    {t:'CO', q:'在陌生的场合，我也能自在地表达自己'},
    {t:'CO', q:'我喜欢带领一群人朝同一个目标前进'},
    {t:'CO', q:'谈判或争取资源时，我通常能占据主动'},
    {t:'CO', q:'我享受上台演讲或向众人展示的场合'},
    {t:'EM', q:'我能敏锐地察觉到别人情绪的变化'},
    {t:'EM', q:'别人遇到困难时，我常常是第一个主动上前的人'},
    {t:'EM', q:'我擅长倾听，也愿意耐心陪伴他人'},
    {t:'EM', q:'团队出现矛盾时，我常充当调和的那个人'},
    {t:'EM', q:'看到别人因为我的帮助而变好，我会非常有成就感'},
    {t:'EX', q:'我习惯把事情列成清单，一项一项完成'},
    {t:'EX', q:'我做事有明确的计划，很少临时抱佛脚'},
    {t:'EX', q:'我擅长管理时间、预算或流程'},
    {t:'EX', q:'我注重细节，常能发现别人忽略的错误'},
    {t:'EX', q:'交付任务时，我追求稳定、准时、可靠'},
    {t:'PR', q:'我喜欢拆装物品，弄清楚它是怎么运作的'},
    {t:'PR', q:'比起听理论，我更愿意直接上手试一试'},
    {t:'PR', q:'我擅长使用工具或操作设备'},
    {t:'PR', q:'我喜欢户外、现场，或需要身体参与的工作'},
    {t:'PR', q:'把图纸或想法变成实物，会让我很有成就感'}
  ];

  const QUESTIONS = (function interleave(list){
    const groups = {};
    list.forEach(o => { (groups[o.t] = groups[o.t] || []).push(o); });
    const lists = Object.keys(groups).map(k => groups[k]);
    const maxLen = Math.max.apply(null, lists.map(l => l.length));
    const out = [];
    for (let i = 0; i < maxLen; i++) {
      lists.forEach(l => { if (l[i]) out.push(l[i]); });
    }
    return out;
  })(RAW_QUESTIONS);

  const OPTIONS = [
    {v:1, label:'完全不符合'},
    {v:2, label:'比较不符合'},
    {v:3, label:'一般 / 说不准'},
    {v:4, label:'比较符合'},
    {v:5, label:'完全符合'}
  ];

  /* ============ 状态 ============ */
  let answers = new Array(QUESTIONS.length).fill(null);
  let idx = 0;
  let locked = false;
  let lastResult = null;

  /* ============ DOM ============ */
  const screens = document.querySelectorAll('.screen');
  const optionsEl = document.getElementById('options');
  const cardEl = document.getElementById('q-card');
  const fillEl = document.getElementById('progress-fill');
  const radarEl = document.getElementById('radar');

  function showScreen(id){
    screens.forEach(s => s.classList.toggle('active', s.id === id));
  }

  /* ============ 测试流程 ============ */
  function updateProgress(){
    const done = answers.filter(a => a !== null).length;
    fillEl.style.width = (done / QUESTIONS.length * 100) + '%';
  }

  function showQuestion(){
    const q = QUESTIONS[idx];
    document.getElementById('q-index').textContent = (idx + 1) + ' / ' + QUESTIONS.length;
    document.getElementById('q-num').textContent = 'Q' + (idx + 1);
    document.getElementById('q-text').textContent = q.q;

    optionsEl.innerHTML = OPTIONS.map(o =>
      '<button class="option' + (answers[idx] === o.v ? ' selected' : '') + '" data-v="' + o.v + '">' +
        '<span class="opt-dot">' + o.v + '</span>' +
        '<span class="opt-label">' + o.label + '</span>' +
      '</button>'
    ).join('');

    cardEl.classList.remove('anim');
    void cardEl.offsetWidth;
    cardEl.classList.add('anim');

    document.getElementById('btn-prev').style.visibility = idx === 0 ? 'hidden' : 'visible';
    updateProgress();
    locked = false;
  }

  function selectOption(v){
    if (locked) return;
    locked = true;
    answers[idx] = v;

    Array.prototype.forEach.call(optionsEl.children, function(btn){
      btn.classList.toggle('selected', Number(btn.dataset.v) === v);
    });
    updateProgress();

    setTimeout(function(){
      if (idx < QUESTIONS.length - 1){
        idx++;
        showQuestion();
      } else {
        locked = false;
        goResult();
      }
    }, 270);
  }

  optionsEl.addEventListener('click', function(e){
    const btn = e.target.closest('.option');
    if (!btn) return;
    selectOption(Number(btn.dataset.v));
  });

  document.getElementById('btn-prev').addEventListener('click', function(){
    if (idx > 0 && !locked){ idx--; showQuestion(); }
  });

  document.getElementById('btn-quit').addEventListener('click', function(){
    answers = new Array(QUESTIONS.length).fill(null);
    idx = 0;
    updateProgress();
    showScreen('screen-intro');
  });

  document.getElementById('btn-start').addEventListener('click', function(){
    answers = new Array(QUESTIONS.length).fill(null);
    idx = 0;
    showScreen('screen-quiz');
    showQuestion();
  });

  document.addEventListener('keydown', function(e){
    if (!document.getElementById('screen-quiz').classList.contains('active')) return;
    if (e.key >= '1' && e.key <= '5' && !locked){
      e.preventDefault();
      selectOption(Number(e.key));
    } else if (e.key === 'Backspace' && idx > 0 && !locked){
      e.preventDefault();
      idx--;
      showQuestion();
    }
  });

  /* ============ 计分 ============ */
  function computeScores(){
    const raw = {};
    TYPES.forEach(t => { raw[t.key] = 0; });
    QUESTIONS.forEach((q, i) => { raw[q.t] += (answers[i] || 3); });
    const norm = {};
    TYPES.forEach(t => { norm[t.key] = Math.max(0, Math.min(1, (raw[t.key] - 5) / 20)); });
    return { raw: raw, norm: norm };
  }

  function toScore(rawVal){
    return Math.round((rawVal - 5) / 20 * 100);
  }

  /* ============ 结果渲染 ============ */
  function goResult(){
    showScreen('screen-result');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderResult();
  }

  function renderResult(){
    const res = computeScores();
    lastResult = res;
    const raw = res.raw;
    const ranked = TYPES.slice().sort((a, b) => raw[b.key] - raw[a.key]);
    const main = ranked[0];

    const titleEl = document.getElementById('res-title');
    titleEl.textContent = main.name;
    titleEl.style.backgroundImage = 'linear-gradient(110deg,' + main.color + ',#ffffff)';
    document.getElementById('res-tagline').textContent = main.tagline;

    drawRadar(res.norm);

    const barsEl = document.getElementById('bars');
    barsEl.innerHTML = ranked.map(t => {
      const pct = toScore(raw[t.key]);
      return '<div class="bar-row">' +
        '<div class="bar-top">' +
          '<span class="bar-name" style="color:' + t.color + '">' + t.name + '</span>' +
          '<span class="bar-pct">' + pct + '</span>' +
        '</div>' +
        '<div class="bar-track"><i style="--c:' + t.color + ';width:' + Math.max(pct, 3) + '%"></i></div>' +
      '</div>';
    }).join('');

    const detail = document.getElementById('res-detail');
    detail.innerHTML =
      '<h3 class="panel-title">天赋画像</h3>' +
      '<p class="desc-text">' + main.desc + '</p>' +
      '<div class="tag-group">' +
        '<div class="tag-label">核心优势</div>' +
        '<div class="tags">' + main.strengths.map(s => '<span class="tag">' + s + '</span>').join('') + '</div>' +
      '</div>' +
      '<div class="tag-group">' +
        '<div class="tag-label">适合的职业方向</div>' +
        '<div class="tags">' + main.careers.map(s => '<span class="tag career">' + s + '</span>').join('') + '</div>' +
      '</div>' +
      '<p class="env-text"><strong>适配的工作环境 · </strong>' + main.env + '</p>';

    const sec = document.getElementById('res-secondary');
    sec.innerHTML =
      '<h3 class="panel-title">你的辅助天赋</h3>' +
      ranked.slice(1, 4).map(t =>
        '<div class="sec-item">' +
          '<span class="sec-dot" style="background:' + t.color + '"></span>' +
          '<span class="sec-name">' + t.name + '</span>' +
          '<span class="sec-score">' + toScore(raw[t.key]) + ' 分</span>' +
        '</div>'
      ).join('');
  }

  /* ============ 雷达图 ============ */
  function drawRadar(norm){
    const canvas = radarEl;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 320;
    const h = w;

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.height = h + 'px';

    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;
    const R = w * 0.30;
    const n = TYPES.length;
    const angleOf = i => -Math.PI / 2 + i * 2 * Math.PI / n;

    for (let ring = 1; ring <= 4; ring++){
      const r = R * ring / 4;
      ctx.beginPath();
      for (let i = 0; i < n; i++){
        const a = angleOf(i);
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.05 + ring * 0.014) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    for (let i = 0; i < n; i++){
      const a = angleOf(i);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.strokeStyle = 'rgba(255,255,255,0.075)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const pts = TYPES.map((t, i) => {
      const a = angleOf(i);
      const v = Math.max(norm[t.key], 0.07);
      return {
        x: cx + Math.cos(a) * R * v,
        y: cy + Math.sin(a) * R * v
      };
    });

    ctx.beginPath();
    pts.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
    ctx.closePath();

    const grad = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    grad.addColorStop(0, 'rgba(91,123,255,0.50)');
    grad.addColorStop(0.55, 'rgba(160,92,255,0.42)');
    grad.addColorStop(1, 'rgba(61,214,160,0.35)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(150,170,255,0.9)';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(120,140,255,0.6)';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;

    pts.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = '#cfd9ff';
      ctx.fill();
    });

    const labelR = R + 26;
    ctx.font = '600 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    TYPES.forEach((t, i) => {
      const a = angleOf(i);
      const x = cx + Math.cos(a) * labelR;
      const y = cy + Math.sin(a) * labelR;
      const cos = Math.cos(a), sin = Math.sin(a);

      ctx.textAlign = Math.abs(cos) < 0.2 ? 'center' : (cos > 0 ? 'left' : 'right');
      ctx.textBaseline = Math.abs(sin) < 0.2 ? 'middle' : (sin > 0 ? 'top' : 'bottom');
      ctx.fillStyle = norm[t.key] >= 0.55 ? t.color : 'rgba(200,210,232,0.7)';
      ctx.fillText(t.short, x, y);
    });
  }

  let resizeTimer = null;
  window.addEventListener('resize', function(){
    if (!document.getElementById('screen-result').classList.contains('active')) return;
    if (!lastResult) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ drawRadar(lastResult.norm); }, 160);
  });

  document.getElementById('btn-restart').addEventListener('click', function(){
    answers = new Array(QUESTIONS.length).fill(null);
    idx = 0;
    lastResult = null;
    updateProgress();
    showScreen('screen-intro');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

})();
</script>
</body>
</html>
