<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>天赋罗盘 · 你的专属职场说明书</title>
<style>
  :root{
    --bg:#05070d;
    --text:#f0f3fa;
    --muted:#8e98ad;
    --gold: #e5c07b;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:20px 16px 60px;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  .orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);}
  .o1{width:500px;height:500px;background:#4f46e5;top:-150px;left:-150px;opacity:.35;}
  .o2{width:450px;height:450px;background:#9333ea;bottom:-100px;right:-150px;opacity:.25;}
  .o3{width:350px;height:350px;background:#06b6d4;top:40%;left:50%;opacity:.15;}

  #app{position:relative;z-index:1;width:100%;max-width:800px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}

  /* 首页 */
  .hero{text-align:center;padding:5vh 0 0;}
  .brand-tag{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.1em;color:var(--gold);
    border:1px solid rgba(229,192,123,.3);background:rgba(229,192,123,.08);
    padding:8px 18px;border-radius:99px;margin-bottom:24px;font-weight:600;
  }
  .brand-tag::before{content:'';display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;box-shadow:0 0 8px var(--gold);}
  .hero h1{font-size:clamp(32px,6vw,48px);line-height:1.15;font-weight:800;margin-bottom:18px;}
  .grad-gold{background:linear-gradient(110deg,#fff 10%,#e5c07b 50%,#d4a343 90%);-webkit-background-clip:text;color:transparent;}
  .lead{color:var(--muted);font-size:15px;line-height:1.8;max-width:480px;margin:0 auto 32px;}
  
  .feature-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:36px;text-align:left;}
  .f-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .f-card h4{font-size:13px;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .f-card p{font-size:11.5px;color:var(--muted);line-height:1.5;}
  .f-card span{font-size:16px;}

  .btn-glow{
    position:relative;display:inline-block;border:none;cursor:pointer;font-family:inherit;
    background:linear-gradient(110deg,#6366f1,#a855f7);color:#fff;font-size:17px;font-weight:600;
    padding:18px 50px;border-radius:99px;box-shadow:0 10px 30px -10px rgba(168,85,247,.8);
    transition:transform .2s;overflow:hidden;width:100%;max-width:320px;
  }
  .btn-glow::after{
    content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:linear-gradient(transparent,rgba(255,255,255,.3),transparent);transform:rotate(45deg);
    animation:shine 3s infinite;
  }
  @keyframes shine{0%{left:-100%;}20%{left:100%;}100%{left:100%;}}
  .btn-glow:hover{transform:translateY(-2px) scale(1.02);}
  .trust-text{margin-top:20px;font-size:12px;color:#4f5a70;display:flex;justify-content:center;gap:16px;}
  .trust-text span{display:flex;align-items:center;gap:4px;}

  /* 答题页 */
  .progress-info{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px;}
  .progress-bar{height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#d946ef);border-radius:99px;transition:width .4s;}
  
  .q-card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:24px;padding:32px 24px 20px;margin-top:20px;}
  .q-num{font-size:12px;font-weight:800;letter-spacing:.1em;color:#a855f7;margin-bottom:12px;}
  .q-text{font-size:18px;line-height:1.6;font-weight:600;margin-bottom:24px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;color:#cbd5e1;font-size:15px;cursor:pointer;transition:all .2s;text-align:left;}
  .option:hover{background:rgba(255,255,255,.07);border-color:rgba(168,85,247,.5);transform:translateX(4px);}
  .opt-dot{flex:0 0 24px;height:24px;line-height:22px;text-align:center;border-radius:50%;border:1px solid rgba(255,255,255,.2);font-size:12px;color:#94a3b8;}
  .option.selected{background:linear-gradient(110deg,rgba(99,102,241,.2),rgba(168,85,247,.2));border-color:#a855f7;color:#fff;}
  .option.selected .opt-dot{background:#a855f7;border-color:#a855f7;color:#fff;font-weight:700;}

  /* 结果页 */
  .result-head{text-align:center;margin-bottom:24px;position:relative;}
  .eyebrow{font-size:12px;letter-spacing:.2em;color:#94a3b8;margin-bottom:8px;text-transform:uppercase;}
  .result-title{font-size:clamp(28px,6vw,42px);font-weight:800;margin-bottom:8px;}
  .result-tagline{color:var(--gold);font-size:15px;letter-spacing:.05em;font-weight:500;}
  
  /* 真正的SVG卡通小人容器 */
  .avatar-box{position:relative;width:160px;height:160px;margin:20px auto 30px;display:flex;align-items:center;justify-content:center;}
  .avatar-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,.15);animation:spin 20s linear infinite;}
  @keyframes spin{100%{transform:rotate(360deg);}}
  .avatar-img{width:120px;height:120px;z-index:2;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5));animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .avatar-box::after{content:'';position:absolute;inset:15px;border-radius:50%;background:currentColor;filter:blur(30px);opacity:.4;}

  .panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:20px;padding:24px;}
  .panel + .panel{margin-top:16px;}
  .panel-title{font-size:13px;font-weight:700;color:#94a3b8;margin-bottom:16px;letter-spacing:.1em;}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .chart-panel{display:flex;align-items:center;justify-content:center;padding:10px;}
  #radar{width:100%;max-width:260px;}

  .bar-row{margin-bottom:14px;}
  .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .bar-track{height:6px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;}
  .bar-track i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .8s ease both;}
  @keyframes grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  .desc-text{color:#cbd5e1;font-size:14.5px;line-height:1.9;margin-bottom:20px;}
  .tag-group{margin-bottom:20px;}
  .tag-label{font-size:12px;color:#64748b;margin-bottom:10px;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{font-size:13px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#e2e8f0;}
  .tag.gold{background:rgba(229,192,123,.1);border-color:rgba(229,192,123,.3);color:var(--gold);}
  .env-text{margin-top:16px;padding-top:16px;border-top:1px dashed rgba(255,255,255,.1);font-size:13.5px;color:#94a3b8;line-height:1.6;}
  
  .sec-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;}
  .sec-item:last-child{border-bottom:none;}
  .sec-dot{width:8px;height:8px;border-radius:50%;}
  .sec-score{margin-left:auto;color:#94a3b8;font-family:monospace;}

  .result-actions{text-align:center;margin-top:30px;}

  @media (max-width:640px){
    .result-grid{grid-template-columns:1fr;}
    .q-card{padding:24px 18px 16px;}
    .btn-glow{max-width:100%;}
  }
</style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
</div>

<main id="app">
  <section class="screen active" id="screen-intro">
    <div class="hero">
      <div class="brand-tag">专业职场测评 · 深度解析版</div>
      <h1>解锁你的<br><span class="grad-gold">天赋说明书</span></h1>
      <p class="lead">
        基于霍兰德职业兴趣理论深度改编。<br>
        用30个真实职场情境，精准定位你的底层天赋，<br>为你匹配最适合的职业赛道与工作环境。
      </p>
      <div class="feature-cards">
        <div class="f-card"><h4><span>🎯</span> 精准定位</h4><p>6大核心天赋维度，发现你的隐藏优势</p></div>
        <div class="f-card"><h4><span>🧭</span> 职业指南</h4><p>匹配高薪岗位，告别盲目的职业试错</p></div>
        <div class="f-card"><h4><span>📊</span> 可视化报告</h4><p>专属雷达图与深度画像，一目了然</p></div>
        <div class="f-card"><h4><span>🎁</span> 专属IP</h4><p>生成你的专属天赋卡通形象</p></div>
      </div>
      <button class="btn-glow" id="btn-start">立即开启测试</button>
      <div class="trust-text"><span>✅ 全程免费</span><span>✅ 无需注册</span><span>✅ 结果保密</span></div>
    </div>
  </section>

  <section class="screen" id="screen-quiz">
    <div class="progress-info"><span id="q-index">1 / 30</span><button class="link-btn" id="btn-quit" style="background:none;border:none;color:#64748b;">退出</button></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-card" id="q-card">
      <div class="q-num" id="q-num">Q1</div>
      <h2 class="q-text" id="q-text"></h2>
      <div class="options" id="options"></div>
      <div style="margin-top:16px;text-align:center;"><button id="btn-prev" style="background:none;border:none;color:#64748b;font-size:13px;">← 上一题</button></div>
    </div>
  </section>

  <section class="screen" id="screen-result">
    <div class="result-head">
      <div class="eyebrow">YOUR TALENT REPORT</div>
      <h1 class="result-title" id="res-title"></h1>
      <p class="result-tagline" id="res-tagline"></p>
      
      <!-- SVG卡通人物容器 -->
      <div class="avatar-box" id="avatar-box">
        <div class="avatar-ring"></div>
        <div class="avatar-img" id="avatar-svg"></div>
      </div>
    </div>

    <div class="result-grid">
      <div class="panel chart-panel"><canvas id="radar"></canvas></div>
      <div class="panel"><h3 class="panel-title">天赋分布</h3><div id="bars"></div></div>
    </div>
    <div class="panel" id="res-detail"></div>
    <div class="panel" id="res-secondary"></div>
    <div class="result-actions">
      <button class="btn-glow" id="btn-restart">复测 / 重新测试</button>
      <div style="margin-top:16px;font-size:12px;color:#475569;">分享报告给朋友，看看你们是不是最佳搭档？</div>
    </div>
  </section>
</main>

  ];

  const RAW_QUESTIONS = [
    {t:'AN', q:'我喜欢钻研复杂问题背后的原理，直到彻底弄懂'},{t:'CR', q:'我经常冒出别人想不到的点子'},{t:'CO', q:'我很容易说服别人接受我的观点'},{t:'EM', q:'我能敏锐地察觉到别人情绪的变化'},{t:'EX', q:'我习惯把事情列成清单，一项一项完成'},{t:'PR', q:'我喜欢拆装物品，弄清楚它是怎么运作的'},{t:'AN', q:'面对一堆杂乱的信息，我能快速理出条理和逻辑'},{t:'CR', q:'我喜欢用文字、图像、音乐或设计来表达自己'},{t:'CO', q:'在陌生的场合，我也能自在地表达自己'},{t:'EM', q:'别人遇到困难时，我常常是第一个主动上前的人'},{t:'EX', q:'我做事有明确的计划，很少临时抱佛脚'},{t:'PR', q:'比起听理论，我更愿意直接上手试一试'},{t:'AN', q:'我习惯用数据或证据来判断一件事的对错'},{t:'CR', q:'一成不变的节奏会让我感到窒息'},{t:'CO', q:'我喜欢带领一群人朝同一个目标前进'},{t:'EM', q:'我擅长倾听，也愿意耐心陪伴他人'},{t:'EX', q:'我擅长管理时间、预算或流程'},{t:'PR', q:'我擅长使用工具或操作设备'},{t:'AN', q:'听到一个结论时，我会先想：它的推理站得住脚吗'},{t:'CR', q:'我容易在平常的事物中发现美感和灵感'},{t:'CO', q:'谈判或争取资源时，我通常能占据主动'},{t:'EM', q:'团队出现矛盾时，我常充当调和的那个人'},{t:'EX', q:'我注重细节，常能发现别人忽略的错误'},{t:'PR', q:'我喜欢户外、现场，或需要身体参与的工作'},{t:'AN', q:'我喜欢解谜题、做推理题，或者研究事物运行的规律'},{t:'CR', q:'我愿意尝试没人做过的方式，哪怕可能失败'},{t:'CO', q:'我享受上台演讲或向众人展示的场合'},{t:'EM', q:'看到别人因为我的帮助而变好，我会非常有成就感'},{t:'EX', q:'交付任务时，我追求稳定、准时、可靠'},{t:'PR', q:'把图纸或想法变成实物，会让我很有成就感'}
  ];

  const OPTIONS = [{v:1, label:'完全不符合'}, {v:2, label:'比较不符合'}, {v:3, label:'一般 / 说不准'}, {v:4, label:'比较符合'}, {v:5, label:'完全符合'}];

  let answers = new Array(RAW_QUESTIONS.length).fill(null);
  let idx = 0, locked = false, lastResult = null;
  const optionsEl = document.getElementById('options');
  const fillEl = document.getElementById('progress-fill');
  const radarEl = document.getElementById('radar');

  function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
  function updateProgress(){ fillEl.style.width = (answers.filter(a => a !== null).length / RAW_QUESTIONS.length * 100) + '%'; }

  function showQuestion(){
    const q = RAW_QUESTIONS[idx];
    document.getElementById('q-index').textContent = (idx + 1) + ' / ' + RAW_QUESTIONS.length;
    document.getElementById('q-num').textContent = 'Q' + (idx + 1);
    document.getElementById('q-text').textContent = q.q;
    optionsEl.innerHTML = OPTIONS.map(o => `<button class="option ${answers[idx] === o.v ? 'selected' : ''}" data-v="${o.v}"><span class="opt-dot">${o.v}</span><span>${o.label}</span></button>`).join('');
    document.getElementById('btn-prev').style.visibility = idx === 0 ? 'hidden' : 'visible';
    updateProgress(); locked = false;
  }

  function selectOption(v){
    if(locked) return; locked = true; answers[idx] = v;
    Array.from(optionsEl.children).forEach(btn => btn.classList.toggle('selected', Number(btn.dataset.v) === v));
    updateProgress();
    setTimeout(() => { if(idx < RAW_QUESTIONS.length - 1){ idx++; showQuestion(); } else { locked = false; goResult(); } }, 250);
  }

  optionsEl.addEventListener('click', e => { const btn = e.target.closest('.option'); if(btn) selectOption(Number(btn.dataset.v)); });
  document.getElementById('btn-prev').onclick = () => { if(idx > 0 && !locked){ idx--; showQuestion(); } };
  document.getElementById('btn-quit').onclick = () => { showScreen('screen-intro'); };
  document.getElementById('btn-start').onclick = () => { answers.fill(null); idx = 0; showScreen('screen-quiz'); showQuestion(); };

  function computeScores(){
    const raw = {}; TYPES.forEach(t => raw[t.key] = 0);
    RAW_QUESTIONS.forEach((q, i) => raw[q.t] += (answers[i] || 3));
    const norm = {}; TYPES.forEach(t => norm[t.key] = Math.max(0, Math.min(1, (raw[t.key] - 5) / 20)));
    return { raw, norm };
  }
  const toScore = r => Math.round((r - 5) / 20 * 100);

  function goResult(){
    showScreen('screen-result'); window.scrollTo({ top: 0, behavior: 'smooth' });
    const res = computeScores(); lastResult = res;
    const ranked = TYPES.slice().sort((a, b) => res.raw[b.key] - res.raw[a.key]);
    const main = ranked[0];

    document.getElementById('res-title').textContent = main.name;
    document.getElementById('res-title').style.color = main.color;
    document.getElementById('res-tagline').textContent = main.tagline;
    
    // 渲染手绘SVG
    const avatarBox = document.getElementById('avatar-box');
    avatarBox.style.color = main.color;
    document.getElementById('avatar-svg').innerHTML = main.svg;

    drawRadar(res.norm);

    document.getElementById('bars').innerHTML = ranked.map(t => `<div class="bar-row"><div class="bar-top"><span style="color:${t.color};font-weight:600">${t.name}</span><span style="color:#94a3b8">${toScore(res.raw[t.key])}</span></div><div class="bar-track"><i style="background:${t.color};width:${Math.max(toScore(res.raw[t.key]), 3)}%"></i></div></div>`).join('');

    document.getElementById('res-detail').innerHTML = `<h3 class="panel-title">天赋画像 / PROFILE</h3><p class="desc-text">${main.desc}</p><div class="tag-group"><div class="tag-label">核心优势</div><div class="tags">${main.strengths.map(s => `<span class="tag">${s}</span>`).join('')}</div></div><div class="tag-group"><div class="tag-label">适合的职业方向</div><div class="tags">${main.careers.map(s => `<span class="tag gold">${s}</span>`).join('')}</div></div><p class="env-text"><strong>适配环境：</strong>${main.env}</p>`;

    document.getElementById('res-secondary').innerHTML = `<h3 class="panel-title">辅助天赋 / SYNERGY</h3>${ranked.slice(1, 4).map(t => `<div class="sec-item"><span class="sec-dot" style="background:${t.color}"></span><span style="font-weight:600">${t.name}</span><span class="sec-score">${toScore(res.raw[t.key])} 分</span></div>`).join('')}`;
  }

  document.getElementById('btn-restart').onclick = () => { answers.fill(null); idx = 0; showScreen('screen-intro'); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  function drawRadar(norm){
    const canvas = radarEl, dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 300, h = w;
    canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const cx = w/2, cy = h/2, R = w * 0.32, n = TYPES.length;
    const angleOf = i => -Math.PI/2 + i * 2 * Math.PI / n;

    for(let ring=1; ring<=4; ring++){
      const r = R * ring / 4; ctx.beginPath();
      for(let i=0; i<n; i++){ const a = angleOf(i), x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.closePath(); ctx.strokeStyle = `rgba(255,255,255,${0.04 + ring*0.015})`; ctx.stroke();
    }
    for(let i=0; i<n; i++){ const a = angleOf(i); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.stroke(); }

    const pts = TYPES.map((t, i) => { const a = angleOf(i), v = Math.max(norm[t.key], 0.08); return { x: cx+Math.cos(a)*R*v, y: cy+Math.sin(a)*R*v }; });
    ctx.beginPath(); pts.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.closePath();
    
    const grad = ctx.createLinearGradient(cx-R, cy-R, cx+R, cy+R);
    grad.addColorStop(0, 'rgba(99,102,241,0.6)'); grad.addColorStop(1, 'rgba(217,70,239,0.4)');
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = '#d946ef'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(217,70,239,0.8)'; ctx.shadowBlur = 15; ctx.stroke(); ctx.shadowBlur = 0;

    pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,3.5,0,Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); });

    const labelR = R + 24; ctx.font = '600 13px sans-serif';
    TYPES.forEach((t,i) => {
      const a = angleOf(i), x = cx+Math.cos(a)*labelR, y = cy+Math.sin(a)*labelR, cos = Math.cos(a), sin = Math.sin(a);
      ctx.textAlign = Math.abs(cos) < 0.2 ? 'center' : (cos > 0 ? 'left' : 'right');
      ctx.textBaseline = Math.abs(sin) < 0.2 ? 'middle' : (sin > 0 ? 'top' : 'bottom');
      ctx.fillStyle = norm[t.key] >= 0.5 ? t.color : '#64748b'; ctx.fillText(t.short, x, y);
    });
  }

  window.addEventListener('resize', () => { if(document.getElementById('screen-result').classList.contains('active') && lastResult){ clearTimeout(window.rt); window.rt = setTimeout(() => drawRadar(lastResult.norm), 150); } });
})();
</script>
</body>
